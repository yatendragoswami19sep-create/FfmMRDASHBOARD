name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Android Project with Field Rx Branding
        run: |
          mkdir app-build && cd app-build
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/assets
          
          # Initialize app with Field Rx branding
          npx cap init "Field Rx" "com.fieldrx.app" --web-dir www
          mkdir www
          cp ../index.html www/index.html
          
          # Check and setup app icon if uploaded
          if [ -f "../icon.png" ]; then
            mkdir -p assets
            cp ../icon.png assets/icon-only.png
            cp ../icon.png assets/icon-foreground.png
            cp ../icon.png assets/splash.png
            npx @capacitor/assets generate --android
          fi

          sed -i 's/<\/head>/<script src="capacitor.js"><\/script><\/head>/g' www/index.html

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.fieldrx.app",
            "appName": "Field Rx",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

          # Update Android strings for app name display
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Field Rx<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Field Rx<\/string>/g' android/app/src/main/res/values/strings.xml

          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Field Rx APK
        uses: actions/upload-artifact@v4
        with:
          name: Field-Rx-APK
          path: app-build/android/app/build/outputs/apk/debug/app-debug.apk
