
name: Build Cordova APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Build Android App with Background Plugin
        run: |
          cordova create valchem-app com.valchem.ffmr "Valchem MR"
          cd valchem-app
          cp ../index.html www/index.html
          cordova platform add android@10.1.2
          cordova plugin add cordova-plugin-geolocation
          cordova plugin add https://github.com/katzer/cordova-plugin-background-mode.git
          cordova build android --debug

      - name: Save APK File
        uses: actions/upload-artifact@v4
        with:
          name: Valchem-MR-APK
          path: valchem-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
